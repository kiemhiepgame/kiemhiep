<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiếm Hiệp 3D - Web Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071018;font-family:Arial,sans-serif}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
#brand{position:absolute;top:18px;left:22px;font-weight:800;font-size:22px}
#help{position:absolute;bottom:18px;left:22px;font-size:14px;line-height:1.6;color:#d9e8ef}
#stats{position:absolute;top:20px;right:22px;text-align:right;font-size:13px}
canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <div id="brand">⚔ KIẾM HIỆP 3D</div>
  <div id="stats">HP: <b id="hp">100</b><br>Nội lực: <b id="mana">100</b></div>
  <div id="help">WASD: Di chuyển · Chuột: Xoay camera · Shift: Chạy · Space: Nhảy · Click: Xuất kiếm · Q: Chưởng pháp</div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
